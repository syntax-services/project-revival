<!doctype html>
<html lang="en-NG">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <link rel="icon" type="image/png" href="/string logo icon.png" />
  <link rel="apple-touch-icon" href="/string logo icon.png" />
  <link rel="canonical" href="https://www.string.com.ng/" />

  <!-- Primary SEO Meta Tags -->
  <title>String | Nigeria's #1 Verified Campus Marketplace & Services</title>
  <meta name="title" content="String | Nigeria's #1 Verified Campus Marketplace & Services" />
  <meta name="description" content="String is the premier hyper-local campus marketplace in Nigeria connecting university students, verified merchants, creators, and freelancers for goods, services, and direct commerce." />
  <meta name="keywords" content="String, String Nigeria, String platform, string marketplace, string campus, buy and sell, verified student merchants, campus services, Nigerian universities, UNILAG, UI, OAU, UNIBEN, FUTA, UNN, campus commerce, campus delivery, secondhand goods, textbooks, gadgets, fashion" />
  <meta name="author" content="String Inc." />
  <meta name="publisher" content="String Inc." />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
  <meta name="theme-color" content="#0a0a0a" />

  <!-- Geo & Regional Targeting (Nigeria) -->
  <meta name="geo.region" content="NG" />
  <meta name="geo.placename" content="Nigeria" />
  <meta name="rating" content="General" />
  <meta name="coverage" content="Worldwide" />
  <meta name="distribution" content="Global" />

  <!-- Open Graph / Facebook / WhatsApp / LinkedIn -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.string.com.ng/" />
  <meta property="og:site_name" content="String" />
  <meta property="og:title" content="String | Nigeria's #1 Verified Campus Marketplace" />
  <meta property="og:description" content="Discover verified student merchants, trending campus gadgets, fashion, and skilled local services on String." />
  <meta property="og:image" content="https://www.string.com.ng/String-logo-dark.png" />
  <meta property="og:image:alt" content="String Campus Marketplace Logo" />
  <meta property="og:locale" content="en_NG" />

  <!-- Twitter / X Cards -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@StringPlatform" />
  <meta name="twitter:creator" content="@StringPlatform" />
  <meta name="twitter:url" content="https://www.string.com.ng/" />
  <meta name="twitter:title" content="String | Campus Commerce & Local Services" />
  <meta name="twitter:description" content="Buy, sell, and discover verified campus merchants across Nigeria on String." />
  <meta name="twitter:image" content="https://www.string.com.ng/String-logo-dark.png" />

  <!-- AI Agents & Search Engine Crawlers Optimization -->
  <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
  <meta name="bingbot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

  <!-- Sitelinks SearchBox & Organization Structured Data (JSON-LD) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://www.string.com.ng/#organization",
        "name": "String",
        "alternateName": [
          "String Platform",
          "String Nigeria",
          "String Campus",
          "String Marketplace",
          "Syntax Services String"
        ],
        "url": "https://www.string.com.ng/",
        "logo": {
          "@type": "ImageObject",
          "@id": "https://www.string.com.ng/#logo",
          "url": "https://www.string.com.ng/string%20logo%20icon.png",
          "caption": "String Logo"
        },
        "image": "https://www.string.com.ng/String-logo-dark.png",
        "description": "String is Nigeria's leading hyper-local verified campus commerce ecosystem, connecting students, freelancers, and businesses.",
        "email": "support@string.com.ng",
        "foundingDate": "2026",
        "areaServed": {
          "@type": "Country",
          "name": "Nigeria"
        },
        "sameAs": [
          "https://twitter.com/StringPlatform",
          "https://github.com/syntax-services/string"
        ]
      },
      {
        "@type": "WebSite",
        "@id": "https://www.string.com.ng/#website",
        "url": "https://www.string.com.ng/",
        "name": "String",
        "description": "Verified Campus Marketplace and Local Services Ecosystem in Nigeria",
        "publisher": {
          "@id": "https://www.string.com.ng/#organization"
        },
        "inLanguage": "en-NG",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://www.string.com.ng/customer/discover?search={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      },
      {
        "@type": "SiteNavigationElement",
        "@id": "https://www.string.com.ng/#navigation",
        "name": [
          "Explore Marketplace",
          "Campus Services",
          "Register Business",
          "Terms of Service",
          "Privacy Policy",
          "Contact Support"
        ],
        "url": [
          "https://www.string.com.ng/customer/discover",
          "https://www.string.com.ng/customer/discover?type=services",
          "https://www.string.com.ng/auth?tab=register",
          "https://www.string.com.ng/terms",
          "https://www.string.com.ng/privacy",
          "https://www.string.com.ng/contact"
        ]
      }
    ]
  }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
